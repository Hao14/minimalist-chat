<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist | Enter</title>
    <link rel="stylesheet" href="base.css?v=split14">
    <link rel="stylesheet" href="desktop.css?v=split1">
    <link rel="stylesheet" href="mobile.css?v=split1">
</head>
<body class="marketing" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 2rem 0;">
    
    <div class="shape yellow-circle bottom-left"></div>
    <div class="shape" style="position: absolute; width: 120px; height: 120px; border: 8px solid var(--text-color); top: 12%; right: 8%; animation: float 7s infinite ease-in-out;"></div>
    <div class="shape" style="position: absolute; width: 45px; height: 45px; background-color: var(--text-color); border-radius: 50%; bottom: 25%; right: 18%; animation: float 5s infinite reverse;"></div>
    <div class="shape" style="position: absolute; width: 300px; height: 300px; background-color: transparent; border: 4px dashed #ccc; border-radius: 50%; top: 35%; left: -80px; z-index: -2; animation: float 12s infinite linear;"></div>

    <div class="container fade-in-up" style="width: 100%;">
        <div id="auth-box" class="brutalist-auth-card">
            
            <div class="auth-toggle">
                <button id="show-login-btn" class="toggle-btn active">Log In</button>
                <button id="show-signup-btn" class="toggle-btn">Sign Up</button>
            </div>

            <form id="email-login-form" class="auth-form active">
                <h1>Welcome <span>Back</span></h1>
                
                <div id="login-step-1">
                    <div class="input-group mt-1">
                        <label>EMAIL ADDRESS</label>
                        <input type="email" id="login-email" placeholder="you@example.com" required>
                    </div>
                    <button type="button" class="auth-submit-btn" id="login-next-btn">Next</button>
                </div>

                <div id="login-step-2" class="hidden">
                    <div class="input-group mt-1">
                        <label>PASSWORD</label>
                        <div class="pw-wrap">
                            <input type="password" id="login-password" placeholder="••••••••" required>
                            <button type="button" class="pw-toggle" data-target="login-password">Show</button>
                        </div>
                    </div>
                    <label class="remember-me"><input type="checkbox" id="remember-me" checked> Remember me</label>
                    <button type="submit" class="auth-submit-btn">Sign In</button>
                    <button type="button" class="action-btn mt-1" id="login-back-btn" style="width: 100%; margin-top: 0.5rem;">Back</button>
                    <a href="#" id="forgot-password-link" class="text-link">Forgot Password?</a>
                </div>
                
                <div class="auth-divider"><span>OR</span></div>
                <button type="button" class="google-btn" id="google-login-btn">Sign In with Google</button>
            </form>

            <form id="email-signup-form" class="auth-form hidden">
                <h1>Create <span>Account</span></h1>
                
                <div id="signup-step-1">
                    <div class="input-group mt-1">
                        <label>EMAIL ADDRESS</label>
                        <input type="email" id="signup-email" placeholder="you@example.com" required>
                    </div>
                    <button type="button" class="auth-submit-btn" id="signup-next-1-btn">Next</button>
                </div>

                <div id="signup-step-2" class="hidden">
                    <div class="input-group mt-1">
                        <label>USERNAME</label>
                        <input type="text" id="signup-username" placeholder="ChatName" required>
                    </div>
                    <div class="input-group">
                        <label>BIRTHDAY <span style="font-weight:400; text-transform:none;">(optional)</span></label>
                        <input type="date" id="signup-birthday">
                    </div>
                    <div class="input-group">
                        <label>PHONE NUMBER <span style="font-weight:400; text-transform:none;">(optional)</span></label>
                        <input type="tel" id="signup-phone" placeholder="+1...">
                    </div>
                    <button type="button" class="auth-submit-btn" id="signup-next-2-btn">Next</button>
                    <button type="button" class="action-btn mt-1" id="signup-back-1-btn" style="width: 100%; margin-top: 0.5rem;">Back</button>
                </div>

                <div id="signup-step-3" class="hidden">
                    <div class="input-group mt-1">
                        <label>PASSWORD</label>
                        <div class="pw-wrap">
                            <input type="password" id="signup-password" placeholder="Min. 6 characters" required>
                            <button type="button" class="pw-toggle" data-target="signup-password">Show</button>
                        </div>
                        <div class="pw-strength"><div class="pw-strength-bar" id="pw-strength-bar"></div></div>
                        <div class="pw-strength-label" id="pw-strength-label"></div>
                    </div>
                    <div class="input-group">
                        <label>CONFIRM PASSWORD</label>
                        <div class="pw-wrap">
                            <input type="password" id="signup-confirm" placeholder="Re-enter password" required>
                            <button type="button" class="pw-toggle" data-target="signup-confirm">Show</button>
                        </div>
                        <div class="pw-match" id="pw-match"></div>
                    </div>
                    <button type="submit" class="auth-submit-btn">Create Account</button>
                    <button type="button" class="action-btn mt-1" id="signup-back-2-btn" style="width: 100%; margin-top: 0.5rem;">Back</button>
                </div>
                
                <div class="auth-divider"><span>OR</span></div>
                <button type="button" class="google-btn" id="google-signup-btn">Sign Up with Google</button>
            </form>
            
        </div>
    </div>

<script>
    // Show/hide password toggles
    document.querySelectorAll('.pw-toggle').forEach(b => b.addEventListener('click', () => {
        const inp = document.getElementById(b.dataset.target); if (!inp) return;
        const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show';
    }));
    // Password strength meter
    const pw = document.getElementById('signup-password');
    const cf = document.getElementById('signup-confirm');
    const STR_LABELS = ['', 'Weak', 'Weak', 'Fair', 'Good', 'Strong'];
    const STR_COLORS = ['#ccc', '#e53935', '#e53935', '#fb8c00', '#fdd835', '#43a047'];
    function refreshStrength() {
        if (!pw) return; const v = pw.value; let s = 0;
        if (v.length >= 6) s++; if (v.length >= 10) s++;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v)) s++;
        s = Math.min(s, 5);
        const bar = document.getElementById('pw-strength-bar'), lab = document.getElementById('pw-strength-label');
        if (bar) { bar.style.width = (v ? [0,20,40,60,80,100][s] : 0) + '%'; bar.style.background = STR_COLORS[s]; }
        if (lab) { lab.textContent = v ? STR_LABELS[s] : ''; lab.style.color = STR_COLORS[s]; }
    }
    function refreshMatch() {
        const m = document.getElementById('pw-match'); if (!m || !cf || !pw) return;
        if (!cf.value) { m.textContent = ''; return; }
        const ok = cf.value === pw.value; m.textContent = ok ? '✓ Passwords match' : '✗ Passwords do not match'; m.style.color = ok ? '#43a047' : '#e53935';
    }
    pw?.addEventListener('input', () => { refreshStrength(); refreshMatch(); });
    cf?.addEventListener('input', refreshMatch);
</script>
<script type="module" src="js/app.js?v=30"></script>
    <div id="brutalist-toast" class="toast-hidden">
    <span id="toast-icon">⚠️</span>
    <span id="toast-message">Error message goes here</span>
    <button id="toast-close">✖</button>
</div>
</body>
</html>
