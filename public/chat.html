<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist | Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shape yellow-circle bottom-left"></div>

    <nav>
        <div class="desktop-nav-links">
            <a href="index.html">Home</a>
            <a href="story.html">Story</a>
            <a href="chat.html" class="active">Chat</a>
        </div>

        <div id="nav-actions" class="desktop-nav"></div> 

        <button id="mobile-menu-btn" class="mobile-only nav-btn">MENU</button>
        <div id="mobile-nav-links" class="mobile-only hidden">
            <a href="index.html" class="mobile-link">HOME</a>
            <a href="story.html" class="mobile-link">STORY</a>
            <button class="action-btn mobile-link-btn" id="open-contacts-btn-mobile">CONTACTS</button>
            <button class="action-btn mobile-link-btn" id="open-settings-btn-mobile">SETTINGS</button>
        </div>
    </nav>
    
    <div class="container fade-in-up app-screen" id="login-container">
        <div id="login-section">
            <h1>Join the <span>Room</span></h1>
            <p class="mb-3">Sign in to start chatting securely.</p>
            <button class="google-btn mb-2" id="google-login-btn">Sign In with Google</button>
            <p class="divider-text">— OR —</p>
            <div id="phone-step-1">
                <input type="tel" id="phone-input" placeholder="Enter Phone (+1...)">
                <div id="recaptcha-container" class="mt-1"></div>
                <button id="send-code-btn" class="mt-1">Send SMS Code</button>
            </div>
            <div id="phone-step-2" class="hidden">
                <input type="text" id="code-input" placeholder="Enter 6-digit code">
                <button id="verify-code-btn">Verify & Login</button>
            </div>
        </div>
    </div>

    <div class="container fade-in-up app-screen hidden" id="profile-setup-container">
        <h1>Who are <span>you?</span></h1>
        <input type="text" id="new-display-name" placeholder="Enter your display name">
        <input type="url" id="new-photo-url" placeholder="Image URL (Leave blank for auto)">
        <button id="save-new-profile-btn">Enter Chat</button>
    </div>

    <div class="chat-container-full app-screen hidden" id="chat-wrapper">
        <div id="chat-interface" class="fade-in-up">
            
            <div id="loading-history" class="hidden">Loading history...</div>
            
            <ul id="messages"></ul>
            
            <div id="typing-status-container" class="hidden">
                <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <span id="typing-text">Someone is typing...</span>
            </div>

            <div id="active-reply-box" class="hidden">
                <div>
                    <strong>Replying to <span id="replying-to-name"></span>:</strong>
                    <span id="replying-to-text"></span>
                </div>
                <span class="cancel-reply" id="cancel-reply-btn">✖</span>
            </div>

            <form id="chat-form" action="">
                <input type="file" id="image-input" accept="image/*" class="hidden">
                <button type="button" id="attach-btn" title="Attach Image">📎</button>
                <input id="message-input" autocomplete="off" placeholder="Message..." />
                <button type="submit" id="send-message-btn">SEND</button>
            </form>
        </div>
    </div>

    <div id="contacts-panel">
        <div class="contacts-header">
            <span>Contacts</span><span class="close-panel" id="close-contacts-btn">✖</span>
        </div>
        <ul id="contacts-list"></ul>
    </div>

    <div id="pm-popup" class="hidden">
        <div class="pm-header"><span id="pm-target-name">User</span><span class="pm-close" id="pm-close-btn">✖</span></div>
        <ul id="pm-messages"></ul>
        <form id="pm-form" action=""><input id="pm-input" autocomplete="off" placeholder="Message..." /><button type="submit">Send</button></form>
    </div>

    <div class="modal-overlay hidden" id="modal-overlay"></div>
    <div id="settings-modal" class="hidden">
        <h2>Settings</h2>
        <img id="settings-photo-preview" class="profile-preview" src="">
        <input type="text" id="edit-display-name" placeholder="Display Name">
        <input type="url" id="edit-photo-url" placeholder="Update Image URL">
        <button id="update-profile-btn">Save Changes</button>
        <button class="google-btn" id="theme-toggle-btn">Toggle Dark Mode 🌓</button>
        <button class="google-btn" id="logout-btn">Log Out</button>
        <p class="cancel-text" id="close-settings-btn">Cancel</p>
    </div>

    <footer>
        <div class="footer-links"><a href="#">FAQ</a><a href="#">Contact</a></div>
        <div class="footer-info">System Time Zone: GMT -8</div>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
