<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist | Chat</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFD700">
    <link rel="apple-touch-icon" href="icon-192.png">
<link id="dynamic-favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='60' rx='25' fill='%23FFD700' stroke='%23000' stroke-width='8'/><path d='M 25 70 L 25 90 L 45 70 Z' fill='%23FFD700' stroke='%23000' stroke-width='8' stroke-linejoin='round'/><circle cx='35' cy='40' r='8' fill='%23000'/><circle cx='65' cy='40' r='8' fill='%23000'/></svg>">    
    <link rel="stylesheet" href="style.css?v=blip3">
</head>
<body>
    <!-- Floating Background Shapes -->
    <div class="shape yellow-circle"></div>
    <div class="shape outline-square"></div>

    <nav>
        <a href="index.html" id="nav-logo">
            <div class="mascot-blip">
                <div class="blip-eye left"></div>
                <div class="blip-eye right"></div>
            </div>
        </a>

        <div class="desktop-nav" style="display: flex; gap: 3rem; justify-content: center; align-items: center; width: 100%;">
            <a href="index.html" class="active">Home</a>
            <a href="story.html">Story</a>
            <a href="chat.html">Chat</a>
        </div>

        <div id="nav-actions" class="desktop-nav"></div> 

        <button id="mobile-menu-btn" class="mobile-only nav-btn">MENU</button>
        <div id="mobile-nav-links" class="mobile-only hidden">
            <a href="index.html" class="mobile-link">HOME</a>
            <a href="story.html" class="mobile-link">STORY</a>
            
            <a href="login.html" class="mobile-link guest-only" style="color: var(--accent-color); font-weight: 800;">LOGIN</a>

            <button class="action-btn mobile-link-btn auth-only" id="open-contacts-btn-mobile">CONTACTS</button>
            <button class="action-btn mobile-link-btn auth-only" id="open-settings-btn-mobile">SETTINGS</button>
        </div>
    </nav>
    <div class="container fade-in-up">
        <h1>Less is <span>More.</span></h1>
        <p class="fade-in-up delay-1">Welcome to a space unburdened by noise. Connect deeply, speak freely, and experience communication in its purest form.</p>
        
        <div class="image-grid fade-in-up delay-2">
            <!-- Grayscale imagery that reveals color on hover -->
            <img src="https://picsum.photos/seed/street/800/600" alt="Street scene">
            <img src="https://picsum.photos/seed/city/800/600" alt="Cityscape">
        </div>
    </div>
    <!-- Add this right before </body> in index.html and story.html -->
    <footer>
        <div class="footer-links">
            <a href="faq.html">FAQ</a>
            <a href="terms.html">Terms of Service</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="mailto:support@minimalist.com">Contact</a>
            <a href="https://github.com/Hao14/minimalist-chat/issues" target="_blank" rel="noopener noreferrer">Bug Report</a>
        </div>
        <div class="footer-info" id="live-clock">SYSTEM TIME: LOADING...</div>
    </footer>
<script type="module" src="app.js?v=toastfix"></script>
    <div id="brutalist-toast" class="toast-hidden">
    <span id="toast-icon">⚠️</span>
    <span id="toast-message">Error message goes here</span>
    <button id="toast-close">✖</button>
</div>
</body>
</html>
