<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimalist | Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Floating Background Shapes -->
    <div class="shape yellow-circle"></div>
    <div class="shape outline-square"></div>

    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="story.html">Story</a>
        <a href="chat.html">Chat</a>
    </nav>
    <div class="container fade-in-up">
        <h1>Less is <span>More.</span></h1>
        <p class="fade-in-up delay-1">Welcome to a space unburdened by noise. Connect deeply, speak freely, and experience communication in its purest form.</p>
        
        <div class="image-grid fade-in-up delay-2">
            <!-- Grayscale imagery that reveals color on hover -->
            <img src="https://picsum.photos/seed/street/800/600" alt="Street scene">
            <img src="https://picsum.photos/seed/city/800/600" alt="Cityscape">
        </div>
    </div>
    <!-- Add this right before </body> in index.html and story.html -->
    <footer>
        <div class="footer-links">
            <a href="#">FAQ</a>
            <a href="#">Contact</a>
            <a href="#">Bug Report</a>
            <a href="#">Terms of Service</a>
            <a href="#">Privacy Policy</a>
        </div>
        <div class="footer-info">
            System Time Zone: GMT -8
        </div>
    </footer>

</html>
