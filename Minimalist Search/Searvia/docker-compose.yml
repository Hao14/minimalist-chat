name: searvia

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-searvia}
      POSTGRES_USER: ${POSTGRES_USER:-searvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-searvia_postgres_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - searvia-local

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data
    networks:
      - searvia-local

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-searvia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-searvia_minio_local_only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - minio-data:/data
    networks:
      - searvia-local

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-searvia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-searvia_minio_local_only}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-searvia-local}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}";
        mc anonymous set none "local/$${OBJECT_STORAGE_BUCKET}"
    networks:
      - searvia-local

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  searvia-local:
    driver: bridge
